services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Opsional: Local LLM. Jalankan dengan:  docker compose --profile llm up -d
  # lalu unduh model sekali:  docker compose exec ollama ollama pull qwen2.5:3b
  # dan set LLM_ENABLED=true di .env
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama

volumes:
  ollama:
